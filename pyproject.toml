[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fit-analyzer"
version = "1.0.0"
description = "Dependency-free FIT activity parser and cycling analytics toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
fit-analyzer = "fit_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["fit_analyzer*"]
